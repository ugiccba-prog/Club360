<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e599" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="100" height="100" rx="24" fill="#090d16" />
  <rect width="96" height="96" x="2" y="2" rx="22" fill="none" stroke="url(#gradBrand)" stroke-width="2.5" opacity="0.6" />

  <!-- 360 circle accent -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#1e2c4a" stroke-width="3" stroke-dasharray="6 4" />
  
  <!-- Energetic Lightning Bolt -->
  <polygon points="54,18 28,52 48,52 44,82 72,46 52,46" fill="url(#gradBrand)" filter="url(#glow)" />
</svg>
